<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>VOID ECONOMY</title><style>body{font-family:system-ui;background:#101827;color:#e7edf7;margin:0;padding:18px}h1{font-size:24px;margin-bottom:3px}small,.muted{color:#9aacc5}button,select{background:#23354d;color:white;border:1px solid #49607b;border-radius:9px;padding:10px;margin:4px 3px 4px 0}button.active{background:#266f87}section{background:#172337;border:1px solid #2b405c;border-radius:13px;padding:13px;margin:13px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 3px;border-bottom:1px solid #2b405c;text-align:right}td:first-child,th:first-child{text-align:left}#log{font-size:12px;max-height:210px;overflow:auto;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#23354d;border-radius:8px;padding:9px}.metric b{display:block;font-size:20px}</style></head><body><h1>VOID ECONOMY</h1><small>Prototype mobile 0.1 · Économie autonome</small><section><div class="grid"><div class="metric">Jour <b id="day">1</b></div><div class="metric">Transactions <b id="trades">0</b></div></div><p>Vitesse de simulation</p><div id="speed"></div><button id="reset">Nouvel univers</button></section><section><label>Système : <select id="system"></select></label><h3>Marché local</h3><table><thead><tr><th>Marchandise</th><th>Prix</th><th>Stock</th></tr></thead><tbody id="market"></tbody></table></section><section><h3>Activité économique</h3><div id="log"></div></section><script>
const names=['Aster','Vega','Orion','Helios','Nyx'];const goods=['Minerai','Métaux','Carburant','Nourriture','Énergie','Électronique','Machines','Médicaments'];const base=[18,45,62,25,30,110,145,95];let worlds=[],agents=[],day=1,trades=0,speed=0,events=[];let seed=123456789;function rnd(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}function init(){seed=(Date.now()>>>0);day=1;trades=0;events=[];worlds=names.map((name,i)=>({name,stocks:goods.map((_,g)=>Math.round(55+rnd()*180+(i===g%5?120:0))),prices:goods.map((_,g)=>Math.round(base[g]*(.7+rnd()*.65))),production:goods.map((_,g)=>1+Math.floor(rnd()*5)+(i===g%5?7:0)),demand:goods.map(()=>2+Math.floor(rnd()*6))}));agents=Array.from({length:20},(_,i)=>({name:'Entreprise '+(i+1),credits:2500+Math.floor(rnd()*3500),location:i%5,cargo:null}));render()}
function tick(){day++;worlds.forEach(w=>goods.forEach((_,g)=>{w.stocks[g]=Math.max(0,w.stocks[g]+w.production[g]-w.demand[g]);const target=base[g]*(110/(w.stocks[g]+45));w.prices[g]=Math.max(2,Math.round(w.prices[g]*.78+target*.22))}));for(const a of agents){if(a.cargo){const w=worlds[a.location],g=a.cargo.good;const revenue=a.cargo.qty*w.prices[g];w.stocks[g]+=a.cargo.qty;a.credits+=revenue;trades++;events.unshift('J'+day+' · '+a.name+' vend '+a.cargo.qty+' '+goods[g]+' à '+w.name+' ('+Math.round(revenue)+' cr)');a.cargo=null;continue}let best=null;for(let g=0;g<goods.length;g++){const src=worlds[a.location];for(let j=0;j<worlds.length;j++){if(j===a.location)continue;const dst=worlds[j];const qty=Math.min(10,Math.floor(src.stocks[g]/3),Math.floor(a.credits/src.prices[g]));const profit=qty*(dst.prices[g]-src.prices[g])-20;if(qty>0&&profit>0&&(!best||profit>best.profit))best={g,j,qty,profit}}}if(best){const src=worlds[a.location],cost=best.qty*src.prices[best.g]+20;src.stocks[best.g]-=best.qty;a.credits-=cost;a.cargo={good:best.g,qty:best.qty};a.location=best.j}}events=events.slice(0,35);render()}
function render(){document.getElementById('day').textContent=day;document.getElementById('trades').textContent=trades;const s=+document.getElementById('system').value||0;document.getElementById('market').innerHTML=goods.map((g,i)=>'<tr><td>'+g+'</td><td>'+worlds[s].prices[i]+' cr</td><td>'+worlds[s].stocks[i]+'</td></tr>').join('');document.getElementById('log').innerHTML=events.map(e=>'<div>'+e+'</div>').join('')||'<span class="muted">Lance la simulation pour voir les échanges.</span>';document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('active',+b.dataset.speed===speed))}
const select=document.getElementById('system');names.forEach((n,i)=>select.add(new Option(n,i)));select.onchange=render;[0,1,10,100].forEach(n=>{const b=document.createElement('button');b.textContent=n===0?'Pause':'×'+n;b.dataset.speed=n;b.onclick=()=>{speed=n;render()};document.getElementById('speed').append(b)});document.getElementById('reset').onclick=()=>{speed=0;init()};setInterval(()=>{for(let i=0;i<speed;i++)tick()},1000);init();
</script></body></html>
